---
- name: Deploy Calculator App to Kubernetes
  hosts: k8s_ws
  gather_facts: no

  tasks:
    - name: Apply deployment manifest
      kubernetes.core.k8s:
        kubeconfig: /home/ec2-user/.kube/config
        state: present
        src: /home/ec2-user/proj-mdp-152-155/k8s/deployment.yml

    - name: Apply service manifest
      kubernetes.core.k8s:
        kubeconfig: /home/ec2-user/.kube/config
        state: present
        src: /home/ec2-user/proj-mdp-152-155/k8s/service.yml
...


