---
- name: Install Kubernetes cluster with kops
  hosts: k8s_ws
  become: yes
  vars:
    cluster_name: "prod.k8s.local"
    state_store: "s3://k8-bucket-abi8971"
    zones: "us-east-1a,us-east-1b"
    node_size: "t2.medium"
    master_size: "t2.medium"
    node_count: 2

  tasks:
    - name: Create Kubernetes cluster using kops
      command: >
        kops create cluster
        --name={{ cluster_name }}
        --state={{ state_store }}
        --zones={{ zones }}
        --node-count={{ node_count }}
        --node-size={{ node_size }}
        --master-size={{ master_size }}
        --yes
      environment:
        KOPS_STATE_STORE: "{{ state_store }}"
      register: kops_create_cluster

    - name: Wait for 3 minutes for resources to be created (optional)
      pause:
        minutes: 3

    - name: Validate the cluster
      command: >
        kops validate cluster
        --name={{ cluster_name }}
        --state={{ state_store }}
      environment:
        KOPS_STATE_STORE: "{{ state_store }}"
      register: kops_validate_cluster
      retries: 10
      delay: 30
      until: kops_validate_cluster.rc == 0

    - name: Output the result of the cluster creation
      debug:
        var: kops_create_cluster.stdout
...


 