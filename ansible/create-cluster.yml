---
- name: Install Kubernetes cluster with Kops
  hosts: k8s_ws
  become: yes

  vars:
    cluster_name: "prod.k8s.local"
    state_store: "s3://k8-bucket-abi8971"
    zones: "us-east-1a,us-east-1b"
    node_size: "t2.medium"
    master_size: "t2.medium"
    node_count: 2

  tasks:
    - name: Create a Kubernetes cluster using Kops
      command: >
        /usr/local/bin/kops create cluster
        --name={{ cluster_name }}
        --state={{ state_store }}
        --zones={{ zones }}
        --node-count={{ node_count }}
        --node-size={{ node_size }}
        --master-size={{ master_size }}
        --yes
      register: kops_create_cluster

    - name: Wait for a few seconds to allow cluster creation to start
      pause:
        seconds: 60

    - name: Validate the cluster creation
      command: >
        /usr/local/bin/kops validate cluster
        --name={{ cluster_name }}
        --state={{ state_store }}
      register: kops_validate_cluster
      retries: 10
      delay: 60
      until: kops_validate_cluster.rc == 0

    - name: Output the result of the cluster creation
      debug:
        var: kops_create_cluster.stdout
...



 