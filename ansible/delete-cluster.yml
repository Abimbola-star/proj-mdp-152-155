---
- name: Delete Kubernetes cluster with Kops
  hosts: k8s_ws
  become: yes
  vars:
    cluster_name: "prod.k8s.local"
    state_store: "k8-bucket-abi8971"

  tasks:
    - name: Check if Kops is installed
      stat:
        path: /usr/local/bin/kops
      register: kops_binary

    - name: Fail if Kops is not installed
      fail:
        msg: "Kops is not installed at /usr/local/bin/kops. Please install it first."
      when: not kops_binary.stat.exists

    - name: Delete Kubernetes cluster
      command: >
        /usr/local/bin/kops delete cluster
        --name {{ cluster_name }}
        --state s3://{{ state_store }}
        --yes
      register: kops_delete_cluster

    - name: Output deletion result
      debug:
        var: kops_delete_cluster.stdout
...
