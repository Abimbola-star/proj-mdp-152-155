apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  namespace: default    # <--- Add this line
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
      - name: calculator
        image: abimbola1994/java-calc:latest
        ports:
        - containerPort: 8080
